<div class="quiz-container" *ngIf="!completed && questions.length">

    <p-card>
  
      <h2>Question {{ currentIndex + 1 }} / {{ questions.length }}</h2>
  
      <h3>{{ currentQuestion.question }}</h3>
  
      <!-- Show image if type is image -->
      <img *ngIf="currentQuestion.type === 'image'"
           [src]="currentQuestion.image"
           class="question-image"/>
  
      <!-- Options -->
      <div class="options">
        <div *ngFor="let option of currentQuestion.options" class="option-row">
          <p-radiobutton 
              name="answer" 
              [value]="option"
              [(ngModel)]="selectedAnswer">
          </p-radiobutton>
          <label style="margin-left: 10px;">{{ option }}</label>
        </div>
      </div>
  
      <button pButton label="Next" (click)="submitAnswer()" 
              [disabled]="!selectedAnswer" class="mt-3">
      </button>
  
    </p-card>
  
  </div>
  
  <!-- Final Score -->
  <div *ngIf="completed" class="result">
    <p-card>
      <h2>Quiz Completed!</h2>
      <h3>Your Score: {{ score }} / {{ questions.length }}</h3>
      <button pButton label="Restart" (click)="currentIndex=0; score=0; completed=false"></button>
    </p-card>
  </div>
