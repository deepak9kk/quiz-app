<div class="quiz-container" *ngIf="gameStarted">
    <p-card>
      <h2>Round: {{ currentRound}} / Team {{ currentTeam! + 1}}</h2>
      <h3>{{ currentQuestion.question }}</h3>
      <img *ngIf="currentQuestion.type === 'image'"
           [src]="currentQuestion.image"
           class="question-image"/>
  
      <div class="options">
        <div *ngFor="let option of currentQuestion.options" class="option-row">
          <p-radiobutton 
              name="answer" 
              [value]="option"
              [(ngModel)]="selectedAnswer">
          </p-radiobutton>
          <label style="margin-left: 10px;">{{ option }}</label>
        </div>
      </div>
  
      <button pButton label="Next" (click)="submitAnswer()" 
              [disabled]="!selectedAnswer" class="mt-3">
      </button>
  
    </p-card>
  
  </div>
  
  <div class="card flex justify-center">
  <p-confirmdialog #cd>
    <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
            <div class="flex flex-col items-center p-8 bg-surface-0 dark:bg-surface-900 rounded">
                <div class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20">
                    <i class="pi pi-question !text-5xl"></i>
                </div>
                <div class="flex items-center gap-2 mt-6">
                    <p-button label="Start Game" (onClick)="onAccept()" styleClass="w-32"></p-button>
                </div>
            </div>
    </ng-template>
</p-confirmdialog>
</div>
<p-confirmdialog key="start"/>
<p-confirmdialog key="roundStart"/>
<div class="card">
  <p-progressbar [value]="timeLapsed/0.3" showValue="false" />
</div>
